<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KILLTOY 2</title>
<link rel="icon" type="image/png" href="favicon.png?v=star">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* An app window on a dark desk: the real KILLTOY screen (app.html) runs inside a
     Mac-style window, sized 16:10 and scaled to fit, or filling the browser.
     To its right: REC. Below: the recordings, per version (bugrec.js). */
  :root {
    --desk: #121214;
    --frame: #1d1e21;
    --bar: #18191b;
    --pill: #1c1c1f;
    --pill-2: #2a2a2f;
    --pill-3: #34343a;
    --ink: #ececee;
    --ink-2: rgba(236, 236, 238, 0.55);
    --ink-3: rgba(236, 236, 238, 0.32);
    --line: rgba(255, 255, 255, 0.07);
    --acid: #e4ff3a;
    --red: #ff3b4e;
    --purple: #8b6cff;
    --font: Inter, "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.4 var(--font); overflow-x: hidden; }
  button { font: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* the first screen: window (+ REC on its right) and the bar under it */
  .top {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .row { display: flex; gap: 18px; align-items: flex-start; max-width: 100%; }
  .window {
    position: relative; background: var(--frame); border-radius: 11px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.09), 0 30px 90px rgba(0,0,0,0.6);
    transform-origin: top left; flex: none; transition: box-shadow 0.25s;
  }
  .stage { flex: none; position: relative; }
  .titlebar { display: none !important; }
  .titlebar.old {
    height: 30px; background: var(--bar); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; user-select: none;
  }
  .light { width: 12px; height: 12px; border-radius: 50%; }
  .light.r { background: #ff5f57; } .light.y { background: #febc2e; } .light.g { background: #28c840; }
  .titlebar .name { position: absolute; left: 0; right: 0; text-align: center; color: var(--ink-2); font-weight: 500; font-size: 12px; pointer-events: none; }
  iframe { display: block; border: 0; background: var(--frame); }
  #app:fullscreen { width: 100vw !important; height: 100vh !important; transform: none !important; }

  /* pills (Eman's reference, 4 Nov): rounded dark capsules, lighter pill = the picked one */
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 4px; box-sizing: border-box;
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }
  .pill > button, .pbtn { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .pill > button:hover, .pbtn:hover { color: var(--ink); }
  .pill > button[aria-pressed="true"] { background: var(--pill-2); color: var(--ink); font-weight: 500; }
  .pbtn { height: 40px; background: var(--pill); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; }
  .ic { width: 32px; padding: 0 !important; display: inline-grid; place-items: center; }
  .ic svg, .pbtn svg { width: 16px; height: 16px; }
  .pbtn.ic { width: 40px; }
  .hint { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: 100%; }
  .hint .tip { display: none; }

  /* sound FX volume (Eman, 4 Nov): only the UI sound effects, 0-400% */
  .vol { padding: 0 14px 0 16px; gap: 12px; }
  .vol input { width: 120px; accent-color: var(--purple); }
  .vol b { min-width: 44px; color: var(--ink); font: 500 12px var(--mono); text-align: right; }
  .vol b.hot { color: var(--red); }
  /* version picker (Eman, 4 Nov): go back and test how an older build was */
  .vers { position: relative; }
  .vers > button b { color: var(--ink); font-weight: 600; }
  .vers > button svg { width: 12px; height: 12px; opacity: 0.6; }
  .vmenu { position: absolute; bottom: calc(100% + 8px); left: 50%; translate: -50% 0; min-width: 280px; max-width: calc(100vw - 32px); z-index: 20;
    display: flex; flex-direction: column; padding: 6px; background: var(--pill); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  .vmenu button { background: transparent; border: 0; color: var(--ink-2); cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 10px; text-align: left; padding: 8px 10px; border-radius: 12px; }
  .vmenu button:hover { background: rgba(255,255,255,0.05); }
  .vmenu button b { font-weight: 700; color: var(--ink); grid-row: span 2; }
  .vmenu button span { color: var(--ink); }
  .vmenu button small { color: var(--ink-3); font-size: 11px; }
  .vmenu button[aria-current="true"] { background: var(--pill-2); }
  .vmenu button[aria-current="true"] b { color: var(--purple); }

  /* REC on the right of the window (Eman, 4 Nov); in the bar when there's no room or in Fill browser */
  .rail { width: 200px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .recbig { height: 64px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 12px; padding: 0 10px; font-weight: 600; letter-spacing: 0.06em; transition: background 0.15s, border-color 0.15s; }
  .recbig:hover { background: var(--pill-2); }
  .recbig .dot { width: 44px; height: 44px; border-radius: 50%; background: var(--red); display: grid; place-items: center; flex: none; box-shadow: 0 0 0 4px rgba(255,59,78,0.14); }
  .recbig .dot::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: border-radius 0.15s; }
  .recbig .rec-t { font-size: 15px; font-variant-numeric: tabular-nums; }
  .recbig em { margin-left: auto; margin-right: 8px; font-style: normal; font-size: 11px; color: rgba(255,255,255,0.8); display: none; }
  .jump { height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); color: var(--ink-2); text-decoration: none;
    display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .jump:hover { color: var(--ink); }
  .jump b { color: var(--ink); font-weight: 600; }
  .jump i { font-style: normal; margin-left: auto; }
  #bug-count { min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--pill-2); color: var(--ink); font: 500 11px/20px var(--mono); text-align: center; }
  #bug-count:empty { display: none; }
  #rec-btn { display: none; }
  #rec-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  body.norail .rail { display: none; }
  body.norail #rec-btn { display: inline-flex; }
  /* recording: red outline around the whole app, the button turns into STOP */
  body.recording .window { box-shadow: 0 0 0 3px var(--red), 0 0 40px rgba(255,59,78,0.35), 0 30px 90px rgba(0,0,0,0.6); }
  /* filling the browser the outline would sit off screen, so it's drawn inside the edge there */
  body.fill.recording.rec-screen .window::after { display: none; }   /* a real screen take would film it */
  body.fill.recording .window::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--red); pointer-events: none; z-index: 5; }
  body.recording .recbig { background: var(--red); border-color: var(--red); }
  body.recording .recbig .dot { background: rgba(0,0,0,0.25); box-shadow: none; }
  body.recording .recbig .dot::after { border-radius: 3px; animation: recblink 1s steps(2) infinite; }
  body.recording .recbig em { display: block; }
  body.recording #rec-btn { background: var(--red); border-color: var(--red); color: #fff; }
  body.recording #rec-btn .dot { background: #fff; animation: recblink 1s steps(2) infinite; }
  @keyframes recblink { 50% { opacity: 0.25; } }

  /* SCREENSHOT (Eman, 6 Nov 16:38): under REC + the version. A box over the app, moved by dragging
     it, sized from its sides and corners; TAKE IMAGE saves the picture with the recordings. */
  .shotbig { height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 10px; padding: 0 16px; font: inherit; font-weight: 600; font-size: 12px; letter-spacing: 0.08em; }
  .shotbig svg { width: 20px; height: 20px; flex: none; }
  .shotbig:hover { background: var(--pill-2); }
  body.shooting .shotbig, body.shooting #shot-btn { background: #e4ff3a; border-color: #e4ff3a; color: #111; }
  #shot-btn { display: none; padding: 0 10px; }
  #shot-btn svg { width: 18px; height: 18px; }
  body.norail #shot-btn { display: inline-flex; }
  .shot { position: absolute; z-index: 20; box-sizing: border-box; border: 2px solid #e4ff3a; cursor: move; touch-action: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
  .shot i { position: absolute; width: 16px; height: 16px; background: #e4ff3a; border: 2px solid #111; box-sizing: border-box; }
  .shot i[data-h="nw"] { left: -9px; top: -9px; cursor: nwse-resize; } .shot i[data-h="ne"] { right: -9px; top: -9px; cursor: nesw-resize; }
  .shot i[data-h="sw"] { left: -9px; bottom: -9px; cursor: nesw-resize; } .shot i[data-h="se"] { right: -9px; bottom: -9px; cursor: nwse-resize; }
  .shot i[data-h="n"] { left: calc(50% - 8px); top: -9px; cursor: ns-resize; } .shot i[data-h="s"] { left: calc(50% - 8px); bottom: -9px; cursor: ns-resize; }
  .shot i[data-h="w"] { top: calc(50% - 8px); left: -9px; cursor: ew-resize; } .shot i[data-h="e"] { top: calc(50% - 8px); right: -9px; cursor: ew-resize; }
  .shot .shot-size { position: absolute; left: -2px; top: -30px; background: #111; color: #e4ff3a; font: 600 12px/22px var(--mono); padding: 0 8px; white-space: nowrap; pointer-events: none; }
  .shot-bar { position: absolute; z-index: 21; display: flex; gap: 6px; }
  .shot-bar button { height: 40px; border: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; padding: 0 16px; }
  .shot-bar svg { width: 22px; height: 22px; }
  .shot-take { background: #e4ff3a; color: #111; }
  .shot-take:hover { filter: brightness(1.08); }
  .shot-x { background: #1d1d20; color: #fff; padding: 0 12px !important; }
  .shot-x svg { width: 18px; height: 18px; }
  body.shot-busy .shot-bar { opacity: 0.5; pointer-events: none; }
  .shot-flash { position: absolute; inset: 0; z-index: 22; background: #fff; pointer-events: none; animation: shotflash 0.35s ease-out forwards; }
  @keyframes shotflash { from { opacity: 0.7; } to { opacity: 0; } }
  .bc.img .bc-ctl, .bc.img .bc-big, .bc.img .bc-nt { display: none; }
  .bc-mov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: pointer; background: #000; }
  .bc-pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
  .bc-vid:fullscreen .bc-pic { cursor: zoom-out; }

  body.fill .top { padding: 0; gap: 0; }
  body.fill .window { border-radius: 0; }
  body.fill .hint { position: fixed; right: 10px; bottom: 8px; opacity: 0.35; transition: opacity 0.2s; z-index: 5; }
  body.fill .hint:hover, body.fill.recording .hint { opacity: 1; }

  /* RECORDINGS: full page width, as many as you like, one group per version */
  .bugs { padding-block: 28px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .bugs > header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .bugs h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  #bug-status { color: var(--ink-2); }
  #bug-status.bad { color: var(--red); }
  .bg { margin-bottom: 26px; }
  .bg-h { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 0 0 12px; color: var(--ink-2); cursor: pointer; }
  .bg-h:disabled { cursor: default; }
  .bg-h b { color: var(--ink); font-weight: 600; height: 28px; line-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--pill-2); }
  .bg.cur .bg-h b { background: var(--purple); color: #fff; }
  .bg-h i { font-style: normal; color: var(--ink-3); }
  .bg-h:not(:disabled):hover i { color: var(--ink); }
  .bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
  .bg-empty { grid-column: 1 / -1; height: 120px; display: grid; place-items: center; border: 1px dashed rgba(255,255,255,0.1); border-radius: 18px; color: var(--ink-3); }

  .bc { background: var(--pill); border: 1px solid var(--line); border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: border-color 0.2s, box-shadow 0.4s; }
  .bc:hover { border-color: rgba(255,255,255,0.12); }
  .bc.fresh { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,108,255,0.25); }
  .bc-vid { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #0b0b0c; max-width: 100%; }
  .bc-holder { position: absolute; left: 0; top: 0; transform-origin: top left; cursor: pointer; }
  .bc-holder iframe { background: var(--frame); pointer-events: none; }
  .bc-big { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(20,20,22,0.72); color: #fff; display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: opacity 0.15s, scale 0.15s; }
  .bc-big svg { width: 22px; height: 22px; margin-left: 2px; }
  .bc-big:hover { scale: 1.06; }
  .bc.playing .bc-big, .bc.scrub .bc-big { opacity: 0; pointer-events: none; }
  .bc-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); pointer-events: none; }
  .bc-msg:empty { display: none; }
  .bc-vid:fullscreen { border-radius: 0; background: #000; }
  .bc-ctl { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px; border-radius: 999px; background: var(--desk); border: 1px solid var(--line); box-sizing: border-box; }
  .bc-ic { width: 32px; height: 32px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .bc-ic:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  .bc-ic svg { width: 16px; height: 16px; }
  .bc-ctl > .bc-ic:first-child { background: var(--pill-2); color: var(--ink); }
  .bc-snd.off { color: var(--red); }
  .bc-time { font: 500 11px var(--mono); color: var(--ink-3); white-space: nowrap; flex: none; }
  .bc-time b { color: var(--ink); font-weight: 500; }
  .bc-bar { position: relative; flex: 1; min-width: 40px; height: 32px; cursor: pointer; touch-action: none; }
  .bc-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); }
  .bc-fill { position: absolute; left: 0; top: 14px; height: 4px; border-radius: 4px; background: var(--purple); pointer-events: none; }
  .bc-knob { position: absolute; top: 10px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; pointer-events: none; transition: scale 0.1s; }
  .bc-bar:hover .bc-knob, .bc.scrub .bc-knob { scale: 1.25; }
  .bc-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 0 6px; }
  .bc-title { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: 600 13px var(--font); padding: 4px 0; border-radius: 6px; }
  .bc-title:focus { outline: none; box-shadow: 0 1px 0 var(--purple); }
  .bc-meta { color: var(--ink-3); font-size: 11px; white-space: nowrap; }
  .bc-del { height: 26px; min-width: 26px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; padding: 0 8px; font-size: 11px; }
  .bc-del svg { width: 14px; height: 14px; }
  .bc-del:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  .bc-del[data-sure="1"] { background: var(--red); color: #fff; }
  .bc-note { resize: vertical; min-height: 44px; box-sizing: border-box; width: 100%; background: var(--desk); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); font: 13px/1.45 var(--font); padding: 10px 12px; }
  .bc-note::placeholder { color: var(--ink-3); }
  .bc-note:focus { outline: none; border-color: var(--purple); }
  /* several comments per take, one issue each (Eman, 4 Nov) */
  .bc-notes { display: flex; flex-direction: column; gap: 6px; }
  .bc-notes:empty { display: none; }
  .bc-n { display: flex; align-items: flex-start; gap: 6px; }
  .bc-n .bc-note { flex: 1; min-height: 38px; resize: none; overflow: hidden; padding: 8px 12px; }
  .bc-add { resize: none; overflow: hidden; min-height: 38px; padding: 8px 12px; }
  .bc-nt { flex: none; height: 26px; margin-top: 6px; padding: 0 9px; border: 0; border-radius: 999px; background: var(--pill-2); color: var(--acid); font: 600 11px/26px var(--mono, ui-monospace, monospace); cursor: pointer; }
  .bc-nt:hover { background: rgba(255,255,255,0.1); }
  .bc-nx { flex: none; height: 26px; min-width: 26px; margin-top: 6px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; padding: 0 6px; font-size: 11px; }
  .bc-nx svg { width: 12px; height: 12px; }
  .bc-nx:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  .bc-nx[data-sure="1"] { background: var(--red); color: #fff; padding: 0 9px; }
  /* DONE: this take is ready for Claude */
  .bc-done { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px 0 9px; border: 0; border-radius: 999px; background: var(--pill-2); color: var(--ink-2); font: 700 10.5px var(--font); letter-spacing: 0.08em; cursor: pointer; flex: none; }
  .bc-done svg { width: 12px; height: 12px; }
  .bc-done:hover { color: var(--ink); background: rgba(255,255,255,0.1); }
  .bc-done.on { background: var(--purple); color: #fff; }
  .bc.done { border-color: rgba(139,92,255,0.45); }

  /* rrweb replayer */

  .rail, #rec-btn, #shot-btn, .vers, .bugs, #bug-ver { display: none !important; }
</style>

<div class="top">
  <div class="row">
    <div class="stage" id="stage">
      <div class="window" id="window">
        <div class="titlebar"><span class="light r"></span><span class="light y"></span><span class="light g"></span><span class="name">KILLTOY 2</span></div>
        <iframe id="app" title="KILLTOY 2" allow="autoplay; microphone; display-capture"></iframe>
      </div>
    </div>
    <aside class="rail" id="rail">
      <button class="recbig" data-rec title="Record a bug: what's on screen and what you hear"><span class="dot"></span><span class="rec-t">REC</span><em>STOP</em></button>
      <button class="shotbig" data-shot title="Take a picture of part of the app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>SCREENSHOT</span></button>
      <a class="jump" href="#bugs" id="jump"><b id="rail-ver">V2</b><span id="bug-count"></span><i>&#8595;</i></a>
    </aside>
  </div>
  <div class="hint">
    <span class="tip"><b>KILLTOY 2.</b> Open QUESTS at the top to play. Space plays and stops.</span>
    <span class="pill" role="group" aria-label="Window size">
      <button id="size-mac" aria-pressed="true">MacBook window</button>
      <button id="size-fill" aria-pressed="false">Fill browser</button>
    </span>
    <button class="pbtn" id="full" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Full screen</button>
    <label class="pill vol" id="vol-box" title="Volume of the UI sound effects only (not the music). Double-click: back to 100%">Sound FX <input type="range" id="vol" min="0" max="400" step="1" value="100"><b id="vol-v">100%</b></label>
    <button class="pbtn" id="shot-btn" data-shot title="Take a picture of part of the app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="pbtn" id="rec-btn" data-rec><span class="dot"></span><span class="rec-t">REC</span></button>
    <span class="vers"><button class="pbtn" id="ver-btn" title="Pick a version of the app to test">Version <b id="ver-name">newest</b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><span class="vmenu" id="ver-menu" hidden></span></span>
  </div>
</div>

<section class="bugs" id="bugs">
  <header><h2>Recordings</h2><span id="bug-status"></span></header>
  <div id="bug-groups"></div>
</section>
<span id="bug-ver" hidden></span>

<script>
  const W = 1440, H = 900, BAR = 0, RAIL = 0;   // no title bar: the dots live in the app's own top bar (Eman, 4 Nov)
  const win = document.getElementById("window"), stage = document.getElementById("stage"), frame = document.getElementById("app");
  let mode = "mac";
  try { mode = localStorage.getItem("ktSize") || "mac"; } catch (e) {}

  function layout() {
    document.body.classList.toggle("fill", mode === "fill");
    document.getElementById("size-mac").setAttribute("aria-pressed", mode === "mac");
    document.getElementById("size-fill").setAttribute("aria-pressed", mode === "fill");
    const hint = document.querySelector(".hint"), cw = document.documentElement.clientWidth;
    if (mode === "fill") {
      document.body.classList.add("norail");
      const h = window.innerHeight;
      frame.style.width = cw + "px"; frame.style.height = h - BAR + "px";
      win.style.transform = ""; win.style.width = cw + "px"; stage.style.width = cw + "px"; stage.style.height = h + "px";
      return;
    }
    const rail = cw >= 1000;
    document.body.classList.toggle("norail", !rail);
    const availW = cw - 32 - (rail ? RAIL : 0), availH = window.innerHeight - 28 - hint.offsetHeight - 14;
    const s = Math.min(1, availW / W, availH / (H + BAR));
    frame.style.width = W + "px"; frame.style.height = H + "px";
    win.style.transform = `scale(${s})`;
    win.style.width = W + "px";
    stage.style.width = W * s + "px"; stage.style.height = (H + BAR) * s + "px";
  }
  const setMode = (m) => { mode = m; try { localStorage.setItem("ktSize", m); } catch (e) {} layout(); frame.focus(); };
  document.getElementById("size-mac").onclick = () => setMode("mac");
  document.getElementById("size-fill").onclick = () => setMode("fill");
  document.getElementById("full").onclick = () => {
    // the DAW alone fills the screen: no REC, SCREENSHOT or bars, just how it looks for real (Eman, 6 Nov 22:00);
    // ?fullold or localStorage ktFullOld=1 = old (the whole page)
    let old = /fullold/.test(location.search); try { old = old || localStorage.getItem("ktFullOld") === "1"; } catch (e) {}
    const el = old ? document.documentElement : frame;
    const p = document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
    frame.focus();
  };
  window.addEventListener("resize", layout);
  document.getElementById("jump").onclick = (e) => { e.preventDefault(); document.getElementById("bugs").scrollIntoView({ behavior: "smooth" }); };

  // SOUND FX volume: only the UI sound effects (kt2-juice.js reads kt2.fxVol); hidden in versions without them
  const volIn = document.getElementById("vol"), volV = document.getElementById("vol-v");
  const showVol = (pc) => { volIn.value = pc; volV.textContent = pc + "%"; volV.classList.toggle("hot", pc > 100); };
  let vol0 = 100;
  try { const v = parseFloat(localStorage.getItem("kt2.fxVol")); if (isFinite(v)) vol0 = Math.round(v * 100); } catch (e) {}
  showVol(vol0);
  const setVol = (pc) => {
    showVol(pc);
    try { localStorage.setItem("kt2.fxVol", String(pc / 100)); } catch (e) {}
    try { frame.contentWindow.postMessage({ ktFxVol: pc / 100, preview: !volIn._t }, "*"); clearTimeout(volIn._t); volIn._t = setTimeout(() => { volIn._t = 0; }, 160); } catch (e) {}
  };
  volIn.addEventListener("input", () => setVol(+volIn.value));
  volIn.addEventListener("dblclick", () => setVol(100));
  volIn.addEventListener("change", () => frame.focus());

  const volBox = () => { const v = VERS.list.find((x) => x.id === ver); document.getElementById("vol-box").hidden = !!(v && v.noFx); };

  // VERSIONS: the newest build is the page itself; older ones are packs run by ver.html
  let VERS = { latest: { name: "newest" }, list: [] }, ver = "";
  try { ver = localStorage.getItem("ktVer") || ""; } catch (e) {}
  const verBtn = document.getElementById("ver-btn"), verMenu = document.getElementById("ver-menu");
  const verName = () => { const v = VERS.list.find((x) => x.id === ver); return v ? v.name : (VERS.latest.name || "newest"); };
  const showVer = () => {
    const v = VERS.list.find((x) => x.id === ver);
    document.getElementById("ver-name").textContent = verName();
    document.getElementById("rail-ver").textContent = verName();
    document.querySelector(".titlebar .name").textContent = "KILLTOY 2" + (v ? " \u00b7 " + v.name + " (older version)" : "");
    window.dispatchEvent(new Event("kt-ver"));
  };
  const pickVer = (id) => {
    ver = VERS.list.some((x) => x.id === id) ? id : "";
    try { localStorage.setItem("ktVer", ver); } catch (e) {}
    showVer(); verMenu.hidden = true; volBox();
    frame.src = ver ? "ver.html#" + ver : "app2.html";
  };
  verBtn.onclick = (e) => {
    e.stopPropagation();
    if (!verMenu.hidden) { verMenu.hidden = true; return; }
    const item = (id, name, note, date) => {
      const b = document.createElement("button");
      b.setAttribute("aria-current", String(id === ver));
      const nb = document.createElement("b"); nb.textContent = name;
      const sp = document.createElement("span"); sp.textContent = id ? note : (note || "The newest build");
      const sm = document.createElement("small"); sm.textContent = id ? (date || "") : "newest";
      b.append(nb, sp, sm); b.onclick = () => pickVer(id); return b;
    };
    verMenu.replaceChildren(item("", VERS.latest.name || "Now", VERS.latest.note), ...[...VERS.list].reverse().map((v) => item(v.id, v.name, v.note, v.date)));
    verMenu.hidden = false;
  };
  document.addEventListener("click", () => { verMenu.hidden = true; });
  if (!ver) frame.src = "app2.html";
  fetch("versions/index.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
    VERS = { latest: d.latest || {}, list: d.list || [] };
    const had = ver;
    if (ver && !VERS.list.some((x) => x.id === ver)) ver = "";
    showVer(); volBox();
    if (ver) frame.src = "ver.html#" + ver; else if (had) frame.src = "app2.html";
  }).catch(() => { verBtn.parentNode.hidden = true; if (ver) { ver = ""; frame.src = "app2.html"; } });
  frame.addEventListener("load", () => frame.focus());
  layout();
  window.ktShell = { frame, verId: () => ver, verName };
</script>
