<script src="/shop.js?v=113"></script>
<script>
function paint() {
  const items = cart.map(byId), rest = PRODUCTS.filter((p) => !inCart(p.id));
  if (!items.length) {
    $("#co").innerHTML = `<h1>Checkout</h1><div class="empty">Your cart is empty.<br><br><a class="btn acid" href="/">Shop packs</a></div>`; return;
  }
  $("#yourH").textContent = `Your packs · ${items.length}`;
  $("#yours").innerHTML = items.map((p) => packRow(p, "in")).join("");
  $("#offer").innerHTML = offerHTML();
  $("#picks").innerHTML = rest.map((p) => packRow(p, "add")).join("");
  $("#dealBlk").hidden = !rest.length;
  $("#sumList").innerHTML = items.map((p) => `<div class="row"><span>${esc(p.name)}</span><span>${freeIds().includes(p.id) ? "FREE" : p.id === pickId() ? "FREE PICK" : money(p.price)}</span></div>`).join("");
  $("#sumCard").hidden = !useCard(); if (useCard()) { $("#sumCardN").textContent = "★ " + cardDef().name + " card"; $("#sumCardOff").textContent = "−" + money(cardOff()); }
  $("#sumPick").hidden = !pickOff(); $("#sumPickOff").textContent = "−" + money(pickOff());
  const off = dealOff(); $("#sumDeal").hidden = !off; $("#sumDeal span").textContent = bundleOn() ? bundleLabel() : "3 for 2"; $("#sumOff").textContent = "−" + money(off);
  $("#sumTot").textContent = money(total());
  $("#sumMeter").innerHTML = meterLine();
  // picked another currency: show what the total is worth in it, then what is actually charged
  const fxb = $("#sumFx"); fxb.hidden = disp() === CUR || !items.length;
  if (!fxb.hidden) fxb.innerHTML = `<div class="fxr"><span>Your currency</span><b>${disp()}</b></div><div class="fxr"><span>Total in ${disp()}</span><b>${show(total())}</b></div>
    <div class="fxr pay"><span>You pay</span><b>${money(total())}</b></div><small>1 ${CUR} ≈ ${fmtIn(conv(1), disp(), conv(1) >= 100 ? 0 : 2)} · your bank converts at its own rate</small>`;
  watchWaves($("#co"));
}
function placeOrder(method) {
  const email = $("#coEmail").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#coEmail").focus(); $("#coEmail").classList.add("bad"); return; }
  $("#coEmail").classList.remove("bad");
  const items = cart.map(byId);
  if (items.every((p) => p.payhip) && window.Payhip) { window.open("https://payhip.com/b/" + items[0].payhip, "_blank"); return; }
  if ($("#coDrops").checked) fetch("/api/optin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email, drops: true, src: "checkout" }) });
  track("buy", null, items.map((p) => p.id).join(","), total());
  // PREVIEW: no money moves. Shows what the buyer gets (and fills the loyalty meter in this browser only).
  const gained = paidCount(), usedPick = pickId() ? 1 : 0;
  try { localStorage.setItem("ck-email", email); const d = demoLoy(); d.paid += gained; d.used += usedPick; localStorage.setItem("ck-loy-demo", JSON.stringify(d)); } catch (e) {}
  LOY.picks -= usedPick;
  if (useCard()) { CARD.used = true; try { localStorage.setItem("ck-card", JSON.stringify(CARD)); } catch (e) {} }
  $("#doneMail").textContent = email;
  $("#doneVia").textContent = method === "paypal" ? "PayPal" : "Card";
  $("#doneTotal").textContent = money(total());
  $("#doneList").innerHTML = items.map((p) => `<div class="li"><img src="${esc(p.cover)}" alt=""><div><b>${esc(p.name)}</b><small>${esc(p.count)}</small></div><a class="btn sm" aria-disabled="true">Download</a></div>`).join("");
  cart = []; saveCart();
  $("#co").hidden = true; $("#done").hidden = false; scrollTo(0, 0);
  if (gained) loyGain(gained);
}
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest(".pv button")) return;
  const add = t.closest("[data-add]"); if (add) { if (!inCart(add.dataset.add)) cart.push(add.dataset.add); saveCart(); paint(); return; }
  const rm = t.closest("[data-rm]"); if (rm) { cart = cart.filter((x) => x !== rm.dataset.rm); saveCart(); paint(); return; }
  const tg = t.closest("[data-tg]"); if (tg) { toggleRow(tg); return; }
  const pay = t.closest("[data-pay]"); if (pay) { placeOrder(pay.dataset.pay); return; }
});
document.addEventListener("ck-cur", paint);
loadShop().then(() => { if (!$("#coEmail").value) $("#coEmail").value = myEmail(); paint(); });
</script>
