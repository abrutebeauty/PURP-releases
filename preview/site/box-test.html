<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COREKULT · sound boxes (test)</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/fonts.css?v=1">
<style>
html,body{margin:0;background:#050505;color:#d6d6de;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
.bx{max-width:1240px;margin:0 auto;padding:48px 24px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:34px 22px}
.bxi{display:block;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
.bxc{position:relative;aspect-ratio:1/1;background:#000;overflow:hidden;border:1px solid #2c2c33}
.bxc canvas{display:block;width:100%;height:100%}
.bxp{position:absolute;left:12px;bottom:12px;width:0;height:0;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;opacity:.85;filter:drop-shadow(0 0 4px #000)}
.bxi.on .bxp{width:14px;height:16px;border:0;border-left:5px solid #fff;border-right:5px solid #fff;box-sizing:border-box}
.bxi.on .bxc{border-color:#8a4dff}
.bxn{margin-top:12px;font-size:14px;text-transform:lowercase;letter-spacing:.01em;color:#cfcfd8}
</style>
</head>
<body>
<div class="bx" id="bx"></div>
<script src="/cs/box.js?v=1"></script>
</body>
</html>
