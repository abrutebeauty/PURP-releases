<script>
/* THE BUNDLE (Eman 18 Nov): every pack in the shop at 50% off. Price only shows here, not on the home tile. */

const PICKS = 4;   // sounds shown per pack before "See full list"
function picks(p) { const L = p.sounds.filter((s) => /^LOOP/i.test(s.name)); const seen = new Set(), out = L.slice(0, 2);
  p.sounds.forEach((s) => { const k = String(s.name).split(/\s+/)[0].toUpperCase(); if (out.length < PICKS && !seen.has(k) && !out.includes(s)) { seen.add(k); out.push(s); } }); return out.slice(0, PICKS); }

const BL = () => (typeof BUNDLE10 !== "undefined" && BUNDLE10 ? bundleMix().map(byId).filter(Boolean) : PRODUCTS);   // BUNDLE10: the 10 packs in the mix

}
function paintPick() {
  const L = BL(), p = L[pick], c = creatorOf(p), box = $("#bnSel"); if (!box) return;
  const others = PRODUCTS.filter((q) => !L.includes(q)), mixed = BUNDLE10 && bundleMix().join() !== defaultMix().join();
  const swapHTML = BUNDLE10 ? `<div class="bnsw"><button class="btn" data-swap>${swapOpen ? "Cancel" : "Swap this pack"}</button>${mixed ? `<button class="btn ghost" data-mixreset>Reset mix</button>` : ""}${ADMIN ? `<button class="btn ghost adm-only" data-mixsave>★ Save as default mix</button>` : ""}</div>
    ${swapOpen ? `<div class="bnswl"><b>Swap ${esc(p.name)} for</b><div>${others.map((q) => `<button class="bnsb" data-swapto="${esc(q.id)}"><img src="${esc(abs(q.cover))}" alt="" loading="lazy"><span>${esc(q.name)}</span></button>`).join("")}</div></div>` : ""}` : "";
  box.innerHTML = swapHTML + `<div class="bnsh"><div class="bnsi"><h2>${esc(p.name)}</h2><div class="pf">${esc(p.sub)} · ${esc(p.count)} · <s>${show(p.price)}</s></div>${c ? `<a class="bnby" href="${creatorUrl(c)}">${avatarHTML(c)}<span>by <b>${typeof CREATOR_AT !== "undefined" && CREATOR_AT ? "@" : ""}${esc(c.name)}</b></span></a>` : ""}</div><a class="btn" href="${packUrl(p.id)}">Open pack</a></div>
    <div class="bnfull">${groupedHTML(p.sounds, p.id)}</div>`;
  watchWaves(box);
  document.querySelectorAll("[data-pick]").forEach((b) => { const on = +b.dataset.pick === pick; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  const ct = $("#bnCt"); if (ct) ct.innerHTML = `<i>${pick + 1}</i> / ${BL().length}`;

function bnPop(b) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  setTimeout(() => b.classList.remove("pop"), 560); const box = $("#bnSel"); if (box) { box.classList.remove("in"); void box.offsetWidth; box.classList.add("in"); } }
function bnRowWire() {
  const row = $("#bnRow"); if (!row) return; let lastI = -1;
  const step = () => (row.querySelector(".bnb") || {}).offsetWidth + 14 || 260;
  const wrap = row.parentNode, edge = () => { const max = row.scrollWidth - row.clientWidth - 4, x = row.scrollLeft;
    wrap.classList.toggle("mid", x > 4); wrap.classList.toggle("end", x >= max);
    const l = $(".bnar.l", wrap), r = $(".bnar.r", wrap); if (l) l.classList.toggle("gone", x <= 4); if (r) r.classList.toggle("gone", x >= max); };
  edge(); addEventListener("resize", edge); row.addEventListener("scroll", edge, { passive: true });
  row.addEventListener("pointerdown", () => { const r = $(".bnar.r", wrap); if (r) r.classList.remove("nudge"); }, { once: true });
  row.addEventListener("scroll", () => { const i = Math.round(row.scrollLeft / step()); if (i !== lastI) { if (lastI >= 0 && window.ckSfx) ckSfx("step", i > lastI ? 1 : -1); lastI = i; } }, { passive: true });

  addEventListener("pointerup", () => { if (!d) return; const m = d.m; d = null; row.classList.remove("drag"); if (m) { row._noclick = true; setTimeout(() => (row._noclick = false), 50); } });
}
/* BN_P10 (Eman 20 Nov 20:00): PICK 10 PACKS page. A map of every pack CD; press one to hear a few sounds, SEE FULL PACK opens the whole pack

const BN_P10 = true;

const p10trio = () => { try { const w = new URLSearchParams(location.search).get("trio"); return w ? trioFor(w) : null; } catch (e) { return null; } };

    : `<div class="eyebrow">The bundle</div><h1>Pick 10 packs</h1>

  $("#bn").innerHTML = `<header class="p10h"><div>${head}</div>${ADMIN && t ? `<button class="adm-trl" data-trlab title="Admin only">Label · ${esc(trioLabel())} ⇄</button>` : ""}
    ${t ? "" : `<div class="p10ct"><div class="p10m" id="p10m"></div><b id="p10n"></b></div>`}</header>
    <div class="p10w${t ? " tri" : ""}"><div class="p10map" id="p10map">${L.map((p, i) => `<div class="p10c${t && i === L.length - 1 ? " free" : ""}" data-p10c="${esc(p.id)}" style="${p10rot(i)}">${t && i === L.length - 1 ? `<em class="p10fr">Free</em>` : ""}<button class="p10cv" data-p10f="${esc(p.id)}" aria-label="Hear ${esc(p.name)}"><img src="${esc(abs(p.cover))}" alt=""${i > 8 ? ' loading="lazy"' : ""}></button>
      <span class="p10nm">${esc(p.name)}<small>${show(p.price)}</small></span>${t ? "" : `<button class="p10pk" data-p10p="${esc(p.id)}" aria-label="Pick ${esc(p.name)}"></button>`}</div>`).join("")}</div>
    <aside class="p10side" id="p10side"></aside></div>`;
  p10paint(); p10side();
}
function p10paint() {
  const t = p10trio(), P = t ? t.ids : pick10(), n = P.length, full = P.reduce((s, id) => s + byId(id).price, 0);
  document.querySelectorAll("[data-p10c]").forEach((c) => { const i = P.indexOf(c.dataset.p10c); c.classList.toggle("on", i >= 0 && !t); c.classList.toggle("foc", c.dataset.p10c === p10foc); const b = c.querySelector(".p10pk"); if (b) b.textContent = i >= 0 ? i + 1 : "+"; });
  const m = $("#p10m"); if (m) m.innerHTML = Array.from({ length: BUNDLE_N }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
  const nn = $("#p10n"); if (nn) nn.innerHTML = `<i>${n}</i> / ${BUNDLE_N} picked`;
  const tot = $("#p10tot"); if (tot) tot.innerHTML = n >= BUNDLE_N ? `<b>${show(full - BUNDLE_OFF)}</b><s>${show(full)}</s>` : `<em>${n ? `${BUNDLE_N - n} more to save ${show(BUNDLE_OFF)}` : ""}</em>`;
  const inCart = P.length && P.every((id) => cart.includes(id));
  $("#bnBar").innerHTML = t
    ? `<div class="wrap"><span><b>${esc(t.name)} 3-pack</b> · ${esc(trioLabel())} · <s>${show(t.full)}</s> <em>${show(t.price)}</em></span><button class="btn acid" data-p10add>${inCart ? "In your cart ✓" : "Add the 3-pack"}</button></div>`
    : `<div class="wrap"><span><b>${n} / ${BUNDLE_N}</b> picked${n >= BUNDLE_N ? ` · <s>${show(full)}</s> <em>${show(full - BUNDLE_OFF)}</em>` : ` · save ${show(BUNDLE_OFF)} at 10`}</span><button class="btn acid" data-p10add ${n >= BUNDLE_N ? "" : "disabled"}>${inCart ? "In your cart ✓" : n >= BUNDLE_N ? `Add ${n} packs` : `Pick ${BUNDLE_N - n} more`}</button></div>`;
}
function p10side() {
  const box = $("#p10side"), p = byId(p10foc); if (!box || !p) return; const t = p10trio(), on = pick10().includes(p.id), c = creatorOf(p);
  box.innerHTML = `<button class="p10x" data-p10x aria-label="Close">×</button><div class="p10sh"><img src="${esc(abs(p.cover))}" alt=""><div><h2>${esc(p.name)}</h2><div class="pf">${esc(p.sub)} · ${esc(p.count)} · ${show(p.price)}</div>${c ? `<a class="bnby" href="${creatorUrl(c)}">${avatarHTML(c)}<span>by <b>${esc(c.name)}</b></span></a>` : ""}</div></div>

  box.classList.toggle("open", p10sheet); watchWaves(box);
}
function p10lb(id) {

        <div class="bnsi"><h2>${esc(p.name)}</h2><div class="pf">${esc(p.sub)} · ${esc(p.count)} · <s>${show(p.price)}</s></div>${c ? `<a class="bnby" href="${creatorUrl(c)}">${avatarHTML(c)}<span>by <b>${typeof CREATOR_AT !== "undefined" && CREATOR_AT ? "@" : ""}${esc(c.name)}</b></span></a>` : ""}</div>
        <button class="btn bnall" data-all="${p.id}" aria-expanded="false">See full list ↓</button></div>
        <div class="pv big">${sounds({ sounds: pk.map((x) => ({ ...x, _tc: typeof tcOf === "function" ? tcOf(x.name, String(x.name).split(/\s+/)[0].toUpperCase()) : undefined, name: String(x.name).split(/\s+/).length > 1 ? String(x.name).replace(/^\S+\s+/, "") : x.name })) })}</div>
        <div class="bnfull" id="f-${p.id}" hidden></div></section>`; }).join("")}`;
  $("#bnBar").innerHTML = `<div class="wrap"><span><b>The bundle</b> · ${n} packs · <s>${show(full)}</s> <em>${show(price)}</em></span><button class="btn acid" data-bundle>${bundleOn() ? "In your cart ✓" : "Get the bundle"}</button></div>`;
  watchWaves($("#bn"));
}
document.addEventListener("click", (e) => {
  if (shopClick(e)) return;
  if (BN_P10 && BUNDLE10 && p10click(e)) return;
  const pk = e.target.closest("[data-pick]");
  if (pk) { const row = $("#bnRow"); if (row && row._noclick) return; pick = +pk.dataset.pick; paintPick(); bnPop(pk); swapOpen = false; try { history.replaceState(null, "", "#" + BL()[pick].id); } catch (er) {} if (window.ckSfx) { ckSfx("press"); setTimeout(() => ckSfx("land"), 200); } pk.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }); return; }
  const sc = e.target.closest("[data-scr]");
  if (sc) { const row = $("#bnRow"); if (row) row.scrollBy({ left: +sc.dataset.scr * row.clientWidth * 0.8, behavior: "smooth" }); if (window.ckSfx) ckSfx("button", +sc.dataset.scr); return; }
  const go = e.target.closest("[data-go]");
  if (go) { const id = go.dataset.go, sec = $("#b-" + id), all = $(`[data-all="${id}"]`);
    if (all && all.getAttribute("aria-expanded") !== "true") all.click(); else if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
    if (window.ckSfx) ckSfx("press"); return; }
  const a = e.target.closest("[data-all]");
  if (a) { const p = byId(a.dataset.all), f = $("#f-" + p.id), open = f.hidden;
    if (open && !f.innerHTML) { f.innerHTML = groupedHTML(p.sounds, p.id); watchWaves(f); }
    f.hidden = !open; a.setAttribute("aria-expanded", open); a.textContent = open ? "Hide list ↑" : "See full list ↓";
    if (open) setTimeout(() => f.scrollIntoView({ behavior: "smooth", block: "start" }), 30); }
  if (BUNDLE10) {
    if (e.target.closest("[data-swap]")) { swapOpen = !swapOpen; paintPick(); return; }
    const sw = e.target.closest("[data-swapto]"); if (sw) { const m = bundleMix(); m[pick] = sw.dataset.swapto; setMix(m); swapOpen = false; picked = true; render(); paintCart(); return; }
    if (e.target.closest("[data-mixreset]")) { setMix(null); swapOpen = false; render(); paintCart(); return; }
    if (e.target.closest("[data-mixsave]") && window.ADM) { window.ADM.bundleMix = bundleMix(); BMIX_DEF = window.ADM.bundleMix; fetch("/api/admin/packs", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(window.ADM) }).then((r) => { const b2 = $("[data-mixsave]"); if (b2) b2.textContent = r.ok ? "Saved · live" : "Not saved"; }); return; }
  }
  if (e.target.closest("[data-bundle]")) {
    BL().forEach((p) => { if (!cart.includes(p.id)) cart.push(p.id); }); saveCart(); paintCart(); track("cart", null, "bundle"); render(); openCart();
  }
});
document.addEventListener("ck-cur", () => { render(); paintCart(); });
loadShop().then(() => { render(); paintCart(); });
</script>
