<script>
/* creator page: /creator/<id>. Creators are COREKULT aliases from creators.json (rename there). */
$("#yr").textContent = new Date().getFullYear();
const CID = decodeURIComponent(location.pathname.split("/")[2] || "");
function render() {
  const c = CREATORS.find((x) => x.id === CID);
  if (!c) { $("#cr").innerHTML = `<div class="empty">Creator not found.<br><br><a class="btn acid" href="/">All packs</a></div>`; return; }
  document.title = c.name + " · COREKULT";
  const ps = packsOf(c), ref = "c-" + c.id;
  $("#cr").innerHTML = `<header class="crh">${avatarHTML(c, "big")}<div><span class="ccb">COREKULT creator</span><h1>${typeof CREATOR_AT !== "undefined" && CREATOR_AT ? "@" : ""}${esc(c.name)}</h1><div class="crv">${esc(c.vibe)}</div><p>${esc(c.bio || "")}</p>
      <div class="crs"><span><b>${ps.length}</b>${ps.length === 1 ? "Kit" : "Kits"}</span><span><b>${ps.reduce((n, p) => n + ((String(p.count).match(/\d+/) || [0])[0] | 0), 0)}</b>Sounds</span></div></div></header>
    <h2 class="sg">Kits by ${esc(c.name)}</h2>
    <div class="grid crg">${ps.map((p) => `<article class="card"><a class="cv" href="${packUrl(p.id)}"><span class="pq"><img src="${esc(abs(p.cover))}" alt="${esc(p.name)} cover" loading="lazy"><i class="gl"></i></span><span class="stamp">${esc(p.stamp)}</span></a>
      <div class="cb"><a class="ph" href="${packUrl(p.id)}"><div><div class="pn">${esc(p.name)}</div><div class="pf">${esc(p.sub)} · ${esc(p.count)}</div></div><div class="price">${show(p.price)}</div></a>
      <div class="buy"><a class="btn" href="/get/${encodeURIComponent(p.id)}?ref=${ref}">Free sample</a><button class="btn acid" data-add="${p.id}">Add to cart</button></div></div></article>`).join("") || `<p class="note">New kits coming soon.</p>`}</div>`;
  track("view", null, "creator:" + c.id);
}
document.addEventListener("click", (e) => { shopClick(e); });
document.addEventListener("ck-cur", () => { render(); paintCart(); });
loadShop().then(() => { render(); paintCart(); });
</script>
